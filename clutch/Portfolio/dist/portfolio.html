<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oscar Solis — Portfolio</title>
  <meta name="description" content="Oscar Solis — Automation Engineer · Python, Django, React, AI tooling." />
  <meta name="theme-color" content="#0a0907" />

  <!-- Favicon — snake/orb mark, used site-wide -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
  <link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png" />
  <link rel="shortcut icon" type="image/png" href="favicon-32.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />

  <!-- Instant paint shell + cinematic boot splash. Pure CSS/SVG, no JS deps. -->
  <style>
    html, body { background: #0a0907; color: #ebe4d7; margin: 0; }
    html.light, body.light { background: #fbfbfd; color: #16181b; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased; overflow-x: hidden; }

    /* ─────────── Boot splash · Portfolio · cinematic v3 ───────────
       All animation runs on transform/opacity (compositor only) for 60fps.
       Layered choreography: ignite → orbit → reveal → settle → handoff.
    */
    #__boot {
      --accent: #ff6b35;
      --accent-warm: #ffb289;
      --ink: #ebe4d7;
      position: fixed; inset: 0; z-index: 9999;
      color: var(--ink);
      overflow: hidden;
      isolation: isolate;
      transition: opacity .6s cubic-bezier(.4,0,.2,1), filter .6s cubic-bezier(.4,0,.2,1);
      will-change: opacity, filter;
      contain: strict;
    }
    /* base background — layered radials, no animation needed */
    #__boot {
      background:
        radial-gradient(ellipse 60% 80% at 50% 120%, rgba(255,107,53,0.12), transparent 60%),
        radial-gradient(ellipse 80% 60% at 50% 50%, #14110d 0%, #0a0907 55%, #050402 100%);
    }
    #__boot.hide { opacity: 0; filter: blur(10px); pointer-events: none; }

    /* fine architectural grid — slow drift adds life */
    #__boot::before {
      content: ''; position: absolute; inset: -1px;
      background-image:
        linear-gradient(to right, rgba(235,228,215,0.035) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(235,228,215,0.035) 1px, transparent 1px);
      background-size: 64px 64px;
      mask-image: radial-gradient(ellipse 70% 60% at 50% 50%, black 30%, transparent 85%);
      -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 50%, black 30%, transparent 85%);
      opacity: 0;
      animation: __grid 1.4s cubic-bezier(.2,.8,.2,1) .05s forwards, __gridDrift 24s linear infinite;
      will-change: opacity, transform;
    }
    @keyframes __grid { to { opacity: 1; } }
    @keyframes __gridDrift {
      from { transform: translate3d(0,0,0); }
      to   { transform: translate3d(64px,64px,0); }
    }

    /* film grain — animated via transform only */
    #__boot::after {
      content: ''; position: absolute; inset: -50%;
      background:
        radial-gradient(rgba(255,255,255,0.025) 1px, transparent 1px) 0 0/3px 3px,
        radial-gradient(rgba(255,107,53,0.018) 1px, transparent 1px) 1px 1px/5px 5px;
      mix-blend-mode: screen; pointer-events: none;
      opacity: .55;
      animation: __grain 1.2s steps(8) infinite;
      will-change: transform;
    }
    @keyframes __grain {
      0%   { transform: translate3d(0,0,0); }
      25%  { transform: translate3d(-8px,4px,0); }
      50%  { transform: translate3d(6px,-6px,0); }
      75%  { transform: translate3d(-4px,8px,0); }
      100% { transform: translate3d(0,0,0); }
    }

    /* aurora — soft warm light blooming up from below the monogram */
    #__boot .aurora {
      position: absolute; left: 50%; top: 50%;
      width: 720px; height: 720px;
      transform: translate(-50%,-50%) scale(.6);
      background:
        radial-gradient(circle at 50% 50%, rgba(255,107,53,0.28), transparent 55%);
      filter: blur(18px);
      opacity: 0; mix-blend-mode: screen;
      animation: __aurora 2.4s cubic-bezier(.2,.8,.2,1) .1s forwards, __auroraPulse 4s ease-in-out 2.4s infinite;
      will-change: transform, opacity;
      pointer-events: none;
    }
    @keyframes __aurora {
      0%   { opacity: 0; transform: translate(-50%,-50%) scale(.6); }
      60%  { opacity: 1; }
      100% { opacity: .85; transform: translate(-50%,-50%) scale(1); }
    }
    @keyframes __auroraPulse {
      0%,100% { opacity: .85; }
      50%     { opacity: .55; }
    }

    /* horizon meridian — laser line through the scene */
    #__boot .meridian {
      position: absolute; top: 50%; left: 50%;
      width: min(720px, 84vw); height: 1px;
      transform: translate(-50%,-50%) scaleX(0);
      transform-origin: 50% 50%;
      background: linear-gradient(90deg,
        transparent 0%, rgba(255,107,53,0) 8%,
        rgba(255,107,53,0.6) 50%,
        rgba(255,107,53,0) 92%, transparent 100%);
      box-shadow: 0 0 24px rgba(255,107,53,0.4);
      animation: __meridian 2s cubic-bezier(.7,0,.2,1) .2s forwards;
      will-change: transform;
    }
    @keyframes __meridian {
      0%   { transform: translate(-50%,-50%) scaleX(0); }
      100% { transform: translate(-50%,-50%) scaleX(1); }
    }

    /* corner registration ticks */
    #__boot .corner {
      position: absolute; width: 22px; height: 22px;
      border-color: rgba(235,228,215,0.45);
      opacity: 0; animation: __corner .8s cubic-bezier(.4,0,.2,1) forwards;
    }
    #__boot .corner.tl { top: 28px; left: 28px; border-top: 1px solid; border-left: 1px solid; animation-delay: 1.4s; }
    #__boot .corner.tr { top: 28px; right: 28px; border-top: 1px solid; border-right: 1px solid; animation-delay: 1.5s; }
    #__boot .corner.bl { bottom: 28px; left: 28px; border-bottom: 1px solid; border-left: 1px solid; animation-delay: 1.6s; }
    #__boot .corner.br { bottom: 28px; right: 28px; border-bottom: 1px solid; border-right: 1px solid; animation-delay: 1.7s; }
    @keyframes __corner { to { opacity: 1; } }

    /* corner labels */
    #__boot .lbl {
      position: absolute; font-family: "JetBrains Mono", ui-monospace, Menlo, monospace;
      font-size: 10px; letter-spacing: .22em; text-transform: uppercase;
      color: rgba(235,228,215,0.45);
      opacity: 0; animation: __corner .8s cubic-bezier(.4,0,.2,1) 1.8s forwards;
    }
    #__boot .lbl.lbl-tl { top: 32px; left: 60px; }
    #__boot .lbl.lbl-tr { top: 32px; right: 60px; color: var(--accent); }
    #__boot .lbl.lbl-tr::before {
      content: ''; display: inline-block; width: 5px; height: 5px; border-radius: 50%;
      background: var(--accent); box-shadow: 0 0 8px var(--accent); margin-right: 8px; vertical-align: middle;
      animation: __live 1.4s ease-in-out infinite;
    }
    #__boot .lbl.lbl-bl { bottom: 32px; left: 60px; }
    #__boot .lbl.lbl-br { bottom: 32px; right: 60px; }
    @keyframes __live { 0%,100% { opacity: 1; } 50% { opacity: .25; } }

    /* center stack */
    #__boot .stack {
      position: absolute; inset: 0; display: grid; place-items: center; align-content: center;
      gap: clamp(20px, 2.6vw, 32px); padding: 24px;
      will-change: transform;
    }

    /* ─── Monogram OS · perfectly balanced ─── */
    #__boot .mono {
      position: relative;
      width: clamp(112px, 13vw, 148px);
      height: clamp(112px, 13vw, 148px);
      opacity: 0;
      animation: __monoIn 1s cubic-bezier(.2,.8,.2,1) .15s forwards;
      will-change: transform, opacity;
    }
    @keyframes __monoIn {
      0%   { opacity: 0; transform: scale(.86); }
      60%  { opacity: 1; }
      100% { opacity: 1; transform: scale(1); }
    }

    /* outer conic ring — sweeps once on entry, then slow ambient drift */
    #__boot .mono .ring {
      position: absolute; inset: 0; border-radius: 50%;
      border: 1px solid rgba(235,228,215,0.10);
      opacity: 0;
      animation: __ringFade .8s ease .35s forwards;
      will-change: opacity;
    }
    @keyframes __ringFade { to { opacity: 1; } }

    /* premium circular trace — orange beam orbits the disc, never stops */
    #__boot .mono .trace {
      position: absolute; inset: -3px;
      width: calc(100% + 6px); height: calc(100% + 6px);
      pointer-events: none;
      overflow: visible;
      opacity: 0;
      animation: __traceFade .6s ease .55s forwards;
      filter: drop-shadow(0 0 10px rgba(255,107,53,0.75));
      z-index: 2;
    }
    #__boot .mono .trace circle {
      fill: none;
      stroke: url(#__pfTraceGrad);
      stroke-width: 2;
      stroke-linecap: round;
      /* perimeter normalized to 500 via pathLength */
      stroke-dasharray: 130 370;
      animation: __traceSpin 3.2s linear .6s infinite;
    }
    @keyframes __traceFade { to { opacity: 1; } }
    @keyframes __traceSpin {
      0%   { stroke-dashoffset: 500; }
      100% { stroke-dashoffset: 0; }
    }

    /* faint inner ring — static, anchors the disc */
    #__boot .mono .ring-inner {
      position: absolute; inset: 6px; border-radius: 50%;
      border: 1px solid rgba(235,228,215,0.18);
      opacity: 0; animation: __corner .8s ease 1.3s forwards;
    }

    /* the OS letterforms — side-by-side, optical-balanced */
    #__boot .mono .letters {
      position: absolute; inset: 0;
      display: flex; flex-direction: row; align-items: center; justify-content: center;
      font-family: "Instrument Serif", ui-serif, Georgia, "Times New Roman", serif;
      font-feature-settings: "kern";
      line-height: 1;
      color: var(--ink);
      opacity: 0;
      animation: __lettersIn 1.1s cubic-bezier(.2,.8,.2,1) .9s forwards;
      will-change: transform, opacity;
    }
    @keyframes __lettersIn {
      0%   { opacity: 0; transform: scale(.9); filter: blur(6px); }
      60%  { opacity: 1; filter: blur(0); }
      100% { opacity: 1; transform: scale(1); filter: blur(0); }
    }
    /* O and S forced to identical visual size via fixed cap-height box */
    #__boot .mono .letters span {
      display: inline-flex; align-items: center; justify-content: center;
      width: 0.58em; height: 0.62em;
      font-size: clamp(64px, 7.6vw, 88px);
      font-style: italic;
      line-height: 1;
      letter-spacing: 0;
    }
    #__boot .mono .letters .o { color: var(--ink); margin-right: -0.06em; }
    #__boot .mono .letters .s {
      color: var(--accent);
      text-shadow: 0 0 18px rgba(255,107,53,0.4);
    }

    /* specular highlight — single sweep across the disc */
    #__boot .mono .gloss {
      position: absolute; inset: 0; border-radius: 50%;
      background: linear-gradient(115deg,
        transparent 35%, rgba(255,255,255,0.25) 48%, rgba(255,255,255,0) 60%);
      -webkit-mask: radial-gradient(circle, black 0 49%, transparent 50%);
              mask: radial-gradient(circle, black 0 49%, transparent 50%);
      opacity: 0;
      transform: translateX(-30%);
      animation: __gloss 2.6s cubic-bezier(.4,0,.2,1) 1.5s forwards;
      pointer-events: none;
      mix-blend-mode: screen;
    }
    @keyframes __gloss {
      0%   { opacity: 0; transform: translateX(-40%); }
      50%  { opacity: .9; }
      100% { opacity: 0; transform: translateX(40%); }
    }

    /* name — letter-by-letter with a soft blur reveal */
    #__boot .name {
      font-family: "Instrument Serif", ui-serif, Georgia, "Times New Roman", serif;
      font-size: clamp(40px, 4.6vw, 60px); letter-spacing: -.015em;
      line-height: 1; color: var(--ink); text-align: center;
      display: flex; gap: .35em; justify-content: center; flex-wrap: wrap;
      will-change: transform;
    }
    #__boot .name .word { display: inline-block; white-space: nowrap; }
    #__boot .name em { font-style: italic; color: var(--accent); }
    #__boot .name .ch {
      display: inline-block;
      opacity: 0;
      transform: translateY(14px);
      filter: blur(8px);
      animation: __chRise 1.1s cubic-bezier(.2,.8,.2,1) forwards;
      will-change: transform, opacity, filter;
    }
    @keyframes __chRise {
      0%   { opacity: 0; transform: translateY(14px); filter: blur(8px); }
      60%  { opacity: 1; filter: blur(0); }
      100% { opacity: 1; transform: translateY(0); filter: blur(0); }
    }

    /* tagline */
    #__boot .tag {
      font-family: "JetBrains Mono", ui-monospace, Menlo, monospace;
      font-size: 11px; letter-spacing: .32em; text-transform: uppercase;
      color: rgba(235,228,215,0.55);
      opacity: 0;
      animation: __rise 1s cubic-bezier(.2,.8,.2,1) 2.4s forwards;
      display: flex; align-items: center; gap: 14px;
      will-change: transform, opacity;
    }
    #__boot .tag .sep {
      width: 24px; height: 1px; background: rgba(235,228,215,0.25);
      transform: scaleX(0); transform-origin: left;
      animation: __sepIn 1s cubic-bezier(.4,0,.2,1) 2.6s forwards;
    }
    @keyframes __rise { to { opacity: 1; transform: none; } }
    @keyframes __sepIn { to { transform: scaleX(1); } }

    /* progress meter at bottom */
    #__boot .meter {
      position: absolute; left: 50%; bottom: 64px;
      width: min(320px, 50vw); height: 1px;
      transform: translateX(-50%);
      background: rgba(235,228,215,0.08); overflow: hidden;
      opacity: 0; animation: __corner .6s ease 1.9s forwards;
    }
    #__boot .meter i {
      display: block; height: 100%; width: 100%;
      background: linear-gradient(90deg, transparent, var(--accent), var(--ink));
      box-shadow: 0 0 12px rgba(255,107,53,0.55);
      transform-origin: left;
      transform: scaleX(0);
      animation: __fill 2.6s cubic-bezier(.5,.05,.2,1) 2s forwards, __fillBreathe 1.6s ease-in-out 4.6s infinite;
      will-change: transform;
    }
    @keyframes __fill { to { transform: scaleX(0.86); } }
    @keyframes __fillBreathe {
      0%, 100% { transform: scaleX(0.86); }
      50%      { transform: scaleX(0.92); }
    }
    /* shimmer travelling along the meter so it never feels stuck */
    #__boot .meter::after {
      content: ''; position: absolute; top: 0; left: 0; height: 100%; width: 60px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.55), transparent);
      filter: blur(1px);
      transform: translateX(-60px);
      animation: __meterShimmer 1.8s linear 2.2s infinite;
      pointer-events: none;
    }
    @keyframes __meterShimmer {
      0%   { transform: translateX(-60px); opacity: 0; }
      15%  { opacity: 1; }
      85%  { opacity: 1; }
      100% { transform: translateX(min(320px, 50vw)); opacity: 0; }
    }

    /* exit choreography */
    #__boot.hide .corner, #__boot.hide .lbl, #__boot.hide .meter,
    #__boot.hide .meridian, #__boot.hide .tag, #__boot.hide .aurora {
      opacity: 0 !important;
    }
    #__boot.hide .stack { transform: scale(1.06); transition: transform .55s cubic-bezier(.4,0,.2,1); }
    #__boot.hide .mono .ring { animation-play-state: paused; }

    /* respect reduced motion */
    @media (prefers-reduced-motion: reduce) {
      #__boot *, #__boot::before, #__boot::after {
        animation-duration: .01ms !important;
        animation-delay: 0s !important;
        animation-iteration-count: 1 !important;
      }
      #__boot .meter i { transform: scaleX(1); }
      #__boot .meridian { transform: translate(-50%,-50%) scaleX(1); }
      #__boot .name .ch, #__boot .mono .letters, #__boot .mono { opacity: 1; transform: none; filter: none; }
    }
  </style>

  <!-- Preconnect + preload critical CSS -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" href="styles.css?v=5" as="style" />
  <link rel="stylesheet" href="styles.css?v=5" />

  <!-- Fonts: load non-blocking. Trimmed to weights we actually use. -->
  <link
    rel="preload"
    as="style"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap"
    onload="this.rel='stylesheet'"
  />
  <noscript>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" />
  </noscript>

  <!-- React production builds — much smaller + faster than the dev bundles. -->
  <script defer src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script defer src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>

  <!--
    Three.js is only used by the Bottle demo. Lazy-load it on demand instead
    of blocking initial render. work.js will await window.__threeReady.
  -->
  <script>
    window.__threeReady = new Promise((resolve) => {
      window.__loadThree = () => {
        if (window.THREE) return resolve(window.THREE);
        const s = document.createElement('script');
        s.src = 'https://unpkg.com/three@0.160.0/build/three.min.js';
        s.onload = () => resolve(window.THREE);
        document.head.appendChild(s);
      };
    });
  </script>
</head>
<body>
  <!-- instant paint splash -->
  <div id="__boot" aria-hidden="true">
    <span class="aurora"></span>
    <span class="meridian"></span>

    <span class="corner tl"></span>
    <span class="corner tr"></span>
    <span class="corner bl"></span>
    <span class="corner br"></span>

    <span class="lbl lbl-tl">PORTFOLIO · MMXXVI</span>
    <span class="lbl lbl-tr">LIVE</span>
    <span class="lbl lbl-bl">EL PASO · TX</span>
    <span class="lbl lbl-br">v 2.0</span>

    <div class="stack">
      <div class="mono" aria-hidden="true">
        <span class="ring"></span>
        <span class="ring-inner"></span>
        <svg class="trace" viewBox="0 0 100 100">
          <defs>
            <linearGradient id="__pfTraceGrad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="100" y2="100">
              <stop offset="0%"  stop-color="rgba(255,107,53,0)"/>
              <stop offset="40%" stop-color="rgba(255,107,53,0.95)"/>
              <stop offset="70%" stop-color="rgba(255,178,137,1)"/>
              <stop offset="100%" stop-color="rgba(235,228,215,1)"/>
            </linearGradient>
          </defs>
          <circle cx="50" cy="50" r="49" pathLength="500"/>
        </svg>
        <span class="letters"><span class="o">O</span><span class="s">S</span></span>
        <span class="gloss"></span>
      </div>

      <div class="name" aria-label="Oscar Solis">
        <span class="word"><span class="ch" style="animation-delay: 1.65s">O</span><span class="ch" style="animation-delay: 1.73s">s</span><span class="ch" style="animation-delay: 1.81s">c</span><span class="ch" style="animation-delay: 1.89s">a</span><span class="ch" style="animation-delay: 1.97s">r</span></span>
        <em class="word"><span class="ch" style="animation-delay: 2.10s">S</span><span class="ch" style="animation-delay: 2.18s">o</span><span class="ch" style="animation-delay: 2.26s">l</span><span class="ch" style="animation-delay: 2.34s">i</span><span class="ch" style="animation-delay: 2.42s">s</span></em>
      </div>

      <div class="tag">
        <span>Automation</span>
        <span class="sep"></span>
        <span>Engineer</span>
      </div>
    </div>

    <div class="meter"><i></i></div>
  </div>

  <div id="root"></div>

  <!-- Pre-transpiled JS (no in-browser Babel). All deferred so HTML parses first. -->
  <script defer src="tweaks-panel.js?v=4"></script>
  <script defer src="components/hero.js?v=4"></script>
  <script defer src="components/about.js?v=4"></script>
  <script defer src="components/demo-tank.js?v=4"></script>
  <script defer src="components/demo-maze.js?v=4"></script>
  <script defer src="components/demo-bottle.js?v=4"></script>
  <script defer src="pokedex-data.js?v=4"></script>
  <script defer src="components/demo-pokedex.js?v=4"></script>
  <script defer src="components/work.js?v=4"></script>
  <script defer src="components/resume.js?v=4"></script>
  <script defer src="components/contact.js?v=4"></script>
  <script defer src="components/app.js?v=5"></script>

  <!-- Hide the splash once React has mounted AND the cinematic has played. -->
  <script>
    (function () {
      const MIN_SHOW_MS = 3200; // let the cinematic land
      const start = performance.now();
      let mounted = false;
      const hide = () => {
        const b = document.getElementById('__boot');
        if (!b) return;
        b.classList.add('hide');
        setTimeout(() => b.remove(), 600);
      };
      const tryHide = () => {
        const elapsed = performance.now() - start;
        if (elapsed < MIN_SHOW_MS) {
          setTimeout(tryHide, MIN_SHOW_MS - elapsed);
          return;
        }
        hide();
      };
      const tick = () => {
        const r = document.getElementById('root');
        if (r && r.firstChild) { mounted = true; return tryHide(); }
        if (performance.now() - start > 8000) return hide(); // fail-safe
        requestAnimationFrame(tick);
      };
      window.addEventListener('DOMContentLoaded', () => requestAnimationFrame(tick));
    })();
  </script>
</body>
</html>
